name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.x is the package's stated floor (Active LTS); 26.x is the
        # current non-LTS release, to catch forward-compatibility breaks
        # before it becomes the next LTS.
        node-version: ['24.x', '26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (JSDoc via tsc)
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
