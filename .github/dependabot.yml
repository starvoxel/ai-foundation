# Dependabot version updates. Security updates are configured in the repo's
# Code security settings; the groups below only shape version-update PRs.
#
# Groups only batch PRs: `*-patch` and `*-minor` for dev dependencies and Actions,
# kept apart so a minor update never joins a patch PR. Auto-merge eligibility is decided by
# .github/scripts/dependabot-auto-merge.mjs, not by group, so an ungrouped patch
# update (a security update, say) of a dev dependency or an Action qualifies too.
# Minor groups, major updates and all runtime dependencies (not grouped yet) are
# reviewed by a human.
#
# `cooldown` holds a new release back for a week before it is proposed, so a
# compromised release is usually caught first. Security updates ignore it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-patch:
        dependency-type: development
        update-types:
          - patch
      dev-minor:
        dependency-type: development
        update-types:
          - minor

  - package-ecosystem: npm
    directory: /servers/gmail
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-patch:
        dependency-type: development
        update-types:
          - patch
      dev-minor:
        dependency-type: development
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-patch:
        update-types:
          - patch
      actions-minor:
        update-types:
          - minor
