name: Merge

# The `/merge` bot (docs/plans/merge-bot.md). When a person comments `/merge` on a PR, this checks the
# PR and either replies with what it would do (dry run, the default) or merges it. The decisions are
# in .github/scripts/merge-logic.mjs.
#
# Live mode is off until the repository variable MERGE_BOT_LIVE is `true`. It also needs the variable
# MERGE_APP_CLIENT_ID and the secret MERGE_APP_PRIVATE_KEY of a GitHub App with contents, pull
# requests and checks permissions, and the App as the only bypass actor of the main ruleset: the bot
# merges after verifying every required check on the head itself, and its own commits skip CI.
#
# A `/merge` while required checks are still running adds the `merge-queued` label and waits; each
# finished CI run settles the waiting PRs, and a wait is dropped after 4 hours, when the branch
# changes, or when the label is removed.
#
# Security notes:
#  - `issue_comment` runs the workflow file and scripts from the default branch, never from the
#    PR, and the script reads only API data: PR code is never checked out or run.
#  - The comment, commenter and PR number reach the script through environment variables, never
#    inline `${{ }}` in a shell, and the comment must be exactly `/merge`.
#  - Dry run uses the job token, scoped to read the repo and comment on the PR. Live mode uses a
#    short-lived App installation token for this repository only, created in the job and never
#    stored.
#  - The App token also makes the bot's own comments trigger this workflow; the script ignores any
#    bot commenter, so that cannot loop.
on:
  issue_comment:
    types: [created]
  # Wakes the PRs waiting for checks (the `merge-queued` label). The run reads only API data, never
  # this event's payload: it lists the labelled PRs itself.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# One run at a time, none cancelled, so two merge requests never race for the same version.
concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/merge'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - name: Checkout the scripts from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Create the merge bot token
        id: app
        if: vars.MERGE_BOT_LIVE == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Decide
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENTER_TYPE: ${{ github.event.comment.user.type }}
          DRY_RUN: ${{ vars.MERGE_BOT_LIVE == 'true' && 'false' || 'true' }}
        run: node .github/scripts/merge.mjs
