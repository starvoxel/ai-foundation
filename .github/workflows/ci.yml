name: CI

on:
  # PRs (any branch) get a run so contributors see results before merging.
  # A bare push only triggers one on main and on `push-check/**` branches.
  # Pushing to any other feature branch with no open PR does NOT trigger CI —
  # avoids paying for runs on WIP commits nobody's reviewing yet. `main`'s
  # required status checks reject a commit that hasn't passed CI, so a
  # `push-check/**` branch is the way to get a commit its CI run without a PR.
  push:
    branches:
      - main
      - "push-check/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel an in-progress run on main — a merge landing while another
  # is still verifying should still get its own recorded result, not be
  # silently superseded. Feature/PR branches are fine to cancel-and-replace
  # since only the latest commit there matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 22.x is the oldest still-supported LTS (Maintenance LTS, and this
  # package's stated engines.node floor). 26.x is the newest release
  # (Current, non-LTS) — testing it catches forward-compatibility breaks
  # before it becomes the next LTS in October.
  NODE_VERSION_MIN: "22.x"
  NODE_VERSION_MAX: "26.x"

jobs:
  # Lint, typecheck, format, validate, snapshot-freshness, and version-bump
  # each run in a few seconds but GitHub bills every job a full minute
  # minimum — as separate jobs they cost ~6x more than the work they do.
  # One job, one checkout, one npm ci; steps are prefixed "Check:" to keep
  # them distinct from the shared setup steps above them in the log.
  # Named for the category (validating the repo meets its various
  # specifications) rather than enumerating the steps, so adding/removing
  # a check here doesn't also mean updating this job's name — and any
  # required-status-check config pinned to it — every time.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      # "false" only when every changed file is under docs/ — see the
      # "Detect docs-only change" step. The Node test jobs read this.
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On a PR, check out the PR head commit itself rather than
          # actions/checkout's default synthetic merge-with-base commit.
          # The version-bump check's parent-branch detection merge-bases
          # against HEAD to rank candidate branches by recency; if HEAD
          # were that synthetic merge commit, main's tip would be a direct
          # parent of it and would always look like the most-recently-
          # forked-from branch, even when the PR was actually cut from
          # another feature branch. github.sha covers push-to-main, where
          # there's no pull_request context.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history needed for the version-bump check: it diffs against
          # `main`'s previous tip on pushes to main, and against the tip of
          # whichever branch was forked from otherwise (found via
          # merge-base against every remote branch) — a shallow checkout
          # can't resolve either the base commit or the other branches.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect docs-only change
        id: changes
        # The Node test jobs only matter when something other than docs/
        # changed (the docs index/link/citation checks all run in this job).
        # Diff base: a PR's base commit; a push to main's previous tip; any
        # other push, the merge-base with main. Anything unknown or failing
        # (first push, all-zeros SHA, git error) fails safe to
        # code_changed=true, so tests run.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          code_changed=true
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$REF_NAME" = "main" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git merge-base origin/main HEAD || true)"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && changed="$(git diff --name-only "$base" HEAD)" && [ -n "$changed" ]; then
            if printf '%s\n' "$changed" | grep -qv '^docs/'; then
              code_changed=true
            else
              code_changed=false
            fi
          fi
          echo "Changed files vs ${base:-<none>}:"
          printf '%s\n' "${changed:-<unknown>}"
          echo "code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: "Check: lint"
        run: npm run lint

      - name: "Check: types (JSDoc via tsc)"
        run: npm run typecheck

      - name: "Check: format"
        run: npm run format:check

      - name: "Check: schema, refs, bundles"
        run: npm run validate

      - name: "Check: snapshot freshness (bundles, servers, hooks)"
        run: node bin/aif.js snapshot --check

      - name: "Check: architecture index (key_files staleness + relative links)"
        run: node bin/aif.js index architecture --check

      - name: "Check: project install drift (warning only)"
        # Reports where the committed .claude/ differs from what this commit's
        # aif would install. Always exits 0; drift shows as a warning annotation.
        run: node bin/aif.js install --scope project --check

      - name: "Check: version bump"
        # A push to main only ever moves forward one accepted state at a
        # time, so that case diffs against its own previous tip
        # (github.event.before — empty or all-zeros on the very first
        # commit, which skips the check). Every PR, and every push to a
        # `push-check/**` branch, diffs against whichever still-existing
        # branch it was most recently forked from (see auto-parent mode in
        # the script), found via merge-base rather than assumed to be main —
        # this also means a branch's own follow-up pushes (e.g. a typo fix)
        # compare against that ancestor's tip, not against each other, so
        # they don't demand a fresh version bump every time. The branch name
        # is github.head_ref on a PR and github.ref_name on a push. Both go
        # through env vars, not inline ${{ }}, so a branch name can't inject
        # shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            node .github/scripts/check-version-bumps.mjs sha "$BEFORE_SHA"
          else
            node .github/scripts/check-version-bumps.mjs auto-parent "${HEAD_REF:-$REF_NAME}"
          fi

  # The two test jobs wait on Validate for its docs-only verdict and are
  # skipped when only docs/ changed. A job skipped by an `if:` reports
  # "Skipped", which a required status check counts as passing — unlike a
  # workflow skipped by a `paths:` filter, which leaves the check Pending
  # forever and blocks the merge. Don't move this filter to `on:`.
  test-node-min:
    name: Test (Node 22.x, min)
    needs: validate
    if: needs.validate.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  test-node-max:
    name: Test (Node 26.x, max)
    needs: validate
    if: needs.validate.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION_MAX }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
