name: "dag"
version: "0.1.0"
protocol: "mcp"
transport: "stdio"
description: "DAG operations for dependency graph validation and wave computation."
tools:
  - name: "dag-validate"
    description: "Validates that an epic's chunk decomposition forms a valid DAG (acyclic, no missing refs)."
    inputs:
      - "epic_path (string): Path to the epic plan markdown file"
    outputs: "JSON object: { valid: boolean, errors: string[] }. Errors include cycle descriptions and missing dependency references."
  - name: "dag-compute-waves"
    description: "Computes execution waves from an epic's chunk dependency graph via topological sort."
    inputs:
      - "epic_path (string): Path to the epic plan markdown file"
    outputs: "JSON object: { waves: string[][], chunks: { id: string, title: string, depends_on: string[], agents: string[] }[] }. Each wave is an array of chunk IDs that can execute in parallel."
