name: Cleanup branches

# Cloud sessions can't delete remote branches, so GitHub does it here, twice a week. This repository
# runs its own `cleanup-branches` action from the same checkout, the way projects run the pinned copy
# that `aif install -I cleanup` installs (lib/integrations/assets/aif-cleanup.yml). The rules are in
# .github/scripts/cleanup-branches.mjs and summarised in docs/architecture/02_constraints.md. Tune
# them with the repository variables CLEANUP_* (the action's README lists them); each is optional.
#
# There is deliberately no push trigger: `main` is pushed many times a week, and every job is
# billed a full minute minimum however short it runs.
on:
  schedule:
    # Mondays and Thursdays, 06:17 UTC.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be done"
        type: boolean
        default: false
      delete_stale:
        description: Also delete Stale branches that have no open PR (one with an open PR still only has the PR closed)
        type: boolean
        default: false
      branches:
        description: "Branches to delete instead of the sweep (space or comma separated). The default branch, protected branches and branches with an open PR are refused."
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    name: Sort, report and clean up branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The action, the script and the project short code in .aiconfig.json.
      - name: Checkout the action and config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/actions/cleanup-branches/
            /.github/scripts/
            /.aiconfig.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run branch cleanup
        uses: ./.github/actions/cleanup-branches
        with:
          enforce: ${{ vars.CLEANUP_ENFORCE }}
          dry-run: ${{ inputs.dry_run }}
          delete-stale: ${{ inputs.delete_stale }}
          branches: ${{ inputs.branches }}
          # The fallback keeps this repository's long-lived branches safe until the variable is set.
          protected-branches: ${{ vars.CLEANUP_PROTECTED_BRANCHES || 'cloud-sandbox agent-testing docs' }}
          ai-branch-prefixes: ${{ vars.CLEANUP_AI_BRANCH_PREFIXES }}
          throwaway-words: ${{ vars.CLEANUP_THROWAWAY_WORDS }}
          keep-empty-branches: ${{ vars.CLEANUP_KEEP_EMPTY_BRANCHES }}
          keep-unrelated-branches: ${{ vars.CLEANUP_KEEP_UNRELATED_BRANCHES }}
          active-days: ${{ vars.CLEANUP_ACTIVE_DAYS }}
          archive-days: ${{ vars.CLEANUP_ARCHIVE_DAYS }}
          active-branches: ${{ vars.CLEANUP_ACTIVE_BRANCHES }}
          archive-branches: ${{ vars.CLEANUP_ARCHIVE_BRANCHES }}
