name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22.x is the oldest still-supported LTS (Maintenance LTS, and this
  # package's stated engines.node floor). 26.x is the newest release
  # (Current, non-LTS) — testing it catches forward-compatibility breaks
  # before it becomes the next LTS in October.
  NODE_VERSION_MIN: '22.x'
  NODE_VERSION_MAX: '26.x'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Type-check (JSDoc via tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

  validate:
    name: Validate (schema, refs, bundles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

  test-node-min:
    name: Test (Node 22.x, min)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MIN }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  test-node-max:
    name: Test (Node 26.x, max)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_MAX }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
