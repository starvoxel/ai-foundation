name: Dependabot auto-merge

# Turns on auto-merge for the lowest-risk Dependabot PRs only: patch updates of
# direct npm dev dependencies and of GitHub Actions. The rule is in
# .github/scripts/dependabot-auto-merge.mjs and fails closed. GitHub then
# merges the PR itself once the required checks pass; this workflow never
# merges, and a red check leaves the PR open. Every other PR waits for a human.
#
# Requires "Allow auto-merge" in the repo's General settings.
#
# Security notes:
#  - `pull_request`, never `pull_request_target`, and the token is scoped to
#    this one job.
#  - The decision script is taken from the default branch, not from the PR, so a
#    PR cannot change the rule that approves it.
#  - Metadata reaches the script through an environment variable, not inline
#    `${{ }}`, so it cannot inject into the shell.
#  - Residual risk: a person with write access who pushes to a Dependabot branch
#    after auto-merge was enabled keeps it enabled; only the required checks
#    gate that commit. Disable auto-merge on the PR if you push to one.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge for safe updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the decision script from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/dependabot-auto-merge.mjs
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          UPDATES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: node .github/scripts/dependabot-auto-merge.mjs

      - name: Enable auto-merge
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
