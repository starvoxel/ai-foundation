name: AIF checks

# Runs ai-foundation's index and bundle-drift checks. Installed by `aif install -I checks`; the
# pin below is bumped by Dependabot's github-actions ecosystem.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: AIF checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Staleness is computed from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: AIF checks
        uses: starvoxel/ai-foundation/.github/actions/checks@{{AIF_SHA}} # {{AIF_VERSION}}
