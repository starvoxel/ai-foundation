name: "dag"
version: "0.3.0"
protocol: "mcp"
transport: "stdio"
description: "DAG operations for dependency graph validation and wave computation."
tools:
  - name: "dag-validate"
    description: "Validates that a tasks.json file forms a valid DAG (acyclic, no missing refs, correct schema)."
    inputs:
      - "tasks_path (string): Path to the tasks.json file"
    outputs: "JSON object: { valid: boolean, errors: string[] }. Errors include schema violations, cycle descriptions, and missing dependency references."
  - name: "dag-compute-waves"
    description: "Computes execution waves from a tasks.json dependency graph via topological sort."
    inputs:
      - "tasks_path (string): Path to the tasks.json file"
    outputs: "JSON object: { waves: string[][], tasks: { id: string, title: string, depends_on: string[] }[] }. Each wave is an array of task IDs that can execute in parallel."
