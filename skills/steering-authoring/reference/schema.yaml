# Steering file schema.
# Lives at steering/{scope}/{name}.md with YAML frontmatter.

frontmatter:
  name: "kebab-case identifier"
  version: "semver (0.1.0)"
  description: "One sentence — what this enforces"
  file_patterns: "[] = always | ['glob', ...] = conditional"

body_sections:
  - section: "Scope"
    content: "Who this applies to and when it loads"
  - section: "Rules"
    content: "Numbered rules, each with Rationale and Exceptions"
  - section: "Enforcement"
    content: "What happens on violation, who catches it"

scopes:
  global: "steering/global/ — all agents, every session"
  domain: "steering/{domain}/ — agents with matching domain field"
  agent: "NOT steering — goes in agent's prompt field"

file_patterns_mapping:
  # Our field → harness native
  empty: "Always loaded"
  populated: "Loaded when working with matching files"
