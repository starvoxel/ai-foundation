# Canonical tool names for agent `tools` and `approved_tools` fields.
# MCP server tools use @server/tool_name format (e.g. @git/git_status).

builtin:
  read: "Read file contents"
  write: "Create or edit files"
  shell: "Execute shell commands"
  web_search: "Search the web"
  web_fetch: "Fetch content from a URL"
  grep: "Regex pattern search in files"
  glob: "Find files by glob pattern"
  code: "Code intelligence (symbols, references, AST)"
  subagent: "Spawn, enumerate, and follow up with dispatched subagents"
  plan: "Human-in-the-loop proposal gate (e.g. Plan Mode)"
  ask_user: "Blocking question to a human, live in-session"
  task: "Agent's own session-scoped progress checklist"
  skill: "Invoke an installed skill by name"

# Risk tiers for approved_tools selection:
approval_guidance:
  safe: [read, grep, glob, code, task, skill, plan, ask_user]
  moderate: [web_search, web_fetch]
  privileged: [write, shell, subagent]

# `subagent` needs a closer note than a tier alone captures: gating it isn't
# one uniform mechanism across the roster — check the specific agent's own
# Hard rules, don't infer from tier or approved_tools membership alone. Some
# agents omit it from `approved_tools` entirely, forcing confirmation for
# every dispatch they make. Others hold it in both `tools` and
# `approved_tools` (routine dispatch they're authorized to make unsupervised)
# but gate specific dispatch targets via an explicit Hard Rule requiring human
# confirmation for that dispatch regardless of `approved_tools` membership.

# Trifecta-avoidance rule: an agent's `tools` list must never combine a
# `moderate` (web) tool with a `privileged` (write/shell) tool unless its own
# Hard rules document the isolation that makes the combination safe. Holding
# web access and an unscoped write/shell leg at once means untrusted web
# content can flow straight into an unreviewed write or command — the
# "lethal trifecta" this repo's own agent roster is deliberately structured
# to avoid (no agent holds all three of write, shell, and web). An agent
# that must combine `moderate` and `privileged` documents the isolation
# directly — e.g. a write leg scoped to one path and no shell at all, the
# way Engineering Researcher holds `write`+`web_search`+`web_fetch` but
# never `shell`, and its `write` is scoped to `.md` output under one
# directory. Combining the tiers with no such documented isolation is an
# authoring error, caught at `skill/agent-authoring`: "Step 8 — Self-validate"'s
# checklist.
