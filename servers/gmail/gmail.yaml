name: "gmail"
version: "0.1.0"
protocol: "mcp"
transport: "stdio"
description: "Gmail operations: search, read, organize, label, and send email via the Gmail API."
tools:
  # ── Read-only ────────────────────────────────────────────────────────────
  - name: "gmail-list-messages"
    description: "Lists/searches messages matching a Gmail search query (same syntax as the Gmail search bar), with optional label filter and pagination."
    inputs:
      - "query (string): Gmail search query, e.g. 'from:someone@example.com is:unread' [optional, default: '']"
      - "label_ids (array): Restrict to messages having all of these label IDs [optional]"
      - "max_results (number): Maximum messages to return [optional, default: 25]"
      - "page_token (string): Pagination token from a previous call's output [optional]"
    outputs: "JSON object: { messages: { id: string, thread_id: string, snippet: string }[], next_page_token: string|null }."

  - name: "gmail-get-message"
    description: "Fetches full content and headers of a single message by ID."
    inputs:
      - "message_id (string): Gmail message ID"
      - "format (string): 'full' (headers+body) or 'metadata' (headers only) [optional, default: 'full']"
    outputs: "JSON object: { id, thread_id, label_ids, from, to, cc, subject, date, snippet, body_text, body_html, attachments: { attachment_id, filename, mime_type, size }[] }."

  - name: "gmail-get-attachment"
    description: "Downloads a single attachment's content from a message."
    inputs:
      - "message_id (string): Gmail message ID"
      - "attachment_id (string): Attachment ID from gmail-get-message's output"
    outputs: "JSON object: { filename, mime_type, size, data_base64 }."

  - name: "gmail-list-labels"
    description: "Lists all labels (system and user-created) in the mailbox."
    inputs: []
    outputs: "JSON object: { labels: { id: string, name: string, type: 'system'|'user' }[] }."

  - name: "gmail-list-drafts"
    description: "Lists existing drafts."
    inputs:
      - "max_results (number): Maximum drafts to return [optional, default: 25]"
      - "page_token (string): Pagination token from a previous call's output [optional]"
    outputs: "JSON object: { drafts: { draft_id: string, message_id: string, snippet: string }[], next_page_token: string|null }."

  - name: "gmail-get-draft"
    description: "Fetches full content of a single draft by ID."
    inputs:
      - "draft_id (string): Draft ID"
    outputs: "JSON object: { draft_id, message_id, to, cc, subject, body_text }."

  - name: "gmail-list-filters"
    description: "Lists all existing Gmail filters (auto-apply-label rules). Check this before creating a new filter to avoid duplicates."
    inputs: []
    outputs: "JSON object: { filters: { id: string, criteria: object, action: object }[] }."

  - name: "gmail-sender-report"
    description: "Convenience/discovery tool, not a dependency of any other tool: aggregates messages matching a query by sender, so a categorization pass can see 'who sends what, how often' as one compact summary instead of reading messages one at a time. Fetches header metadata only (From/Subject) — never message bodies. If this tool is ever removed, the same result can still be obtained by paging gmail-list-messages and calling gmail-get-message (format: 'metadata') per message."
    inputs:
      - "query (string): Gmail search query restricting which messages to aggregate, e.g. 'after:2025/01/01 before:2025/07/01 in:inbox' [optional, default: '']"
      - "max_senders (number): Maximum number of senders to return, ranked by message count descending [optional, default: 50]"
    outputs: "JSON object: { senders: { sender: string, domain: string, count: number, sample_subjects: string[] }[], truncated: boolean }. sample_subjects holds up to 5 distinct subjects per sender so a sender spanning multiple categories (e.g. an investment firm sending both tax slips and promotions) shows that split in one pass. truncated is true if the query matched more messages than this tool's internal per-call scan cap (5000) — pass a narrower query (e.g. a shorter date range) for a complete picture."

  # ── Safe-mutating (reversible/additive, ungated) ────────────────────────
  - name: "gmail-modify-labels"
    description: "Adds and/or removes labels on a message. Covers archive (remove INBOX), mark read/unread (remove/add UNREAD), and star (add/remove STARRED). Reversible — does not send or permanently delete anything."
    inputs:
      - "message_id (string): Gmail message ID"
      - "add_label_ids (array): Label IDs to add [optional]"
      - "remove_label_ids (array): Label IDs to remove [optional]"
    outputs: "JSON object: { id, label_ids: string[] } reflecting the message's labels after the change."

  - name: "gmail-trash-message"
    description: "Moves a message to Trash. Recoverable for 30 days (Gmail auto-purges Trash after that) — distinct from gmail-delete-message, which is permanent. Reversible within the window, so this tool is not gated by the irreversible-action approval steering."
    inputs:
      - "message_id (string): Gmail message ID"
    outputs: "JSON object: { id, label_ids: string[] } reflecting the message's labels after being trashed."

  - name: "gmail-create-draft"
    description: "Creates a new draft. Does not send anything — drafts are only transmitted via gmail-send-draft, which is gated."
    inputs:
      - "to (array): Recipient email addresses"
      - "subject (string): Subject line"
      - "body (string): Plain-text body"
      - "cc (array): CC recipient email addresses [optional]"
      - "bcc (array): BCC recipient email addresses [optional]"
    outputs: "JSON object: { draft_id, message_id }."

  - name: "gmail-create-label"
    description: "Creates a new user label. Additive and reversible via gmail-delete-label (which is gated)."
    inputs:
      - "name (string): Label name, e.g. 'Project X' or nested 'Project X/Invoices'"
    outputs: "JSON object: { id, name }."

  - name: "gmail-create-filter"
    description: "Creates a Gmail filter (auto-apply-label rule). Only affects future mail — does not retroactively apply to existing messages; use gmail-batch-modify-labels with a matching search query to backfill history. Additive and reversible via gmail-delete-filter."
    inputs:
      - "from (string): Match sender address [optional]"
      - "to (string): Match recipient address [optional]"
      - "subject (string): Match subject text [optional]"
      - "query (string): Raw Gmail search string to match [optional]"
      - "negated_query (string): Raw Gmail search string that must NOT match [optional]"
      - "has_attachment (boolean): Match only messages with an attachment [optional]"
      - "exclude_chats (boolean): Exclude chat messages from matching [optional]"
      - "size (number): Match messages by size in bytes, used with size_comparison [optional]"
      - "size_comparison (string): 'larger' or 'smaller', paired with size [optional]"
      - "add_label_ids (array): Label IDs to apply to matching messages [optional]"
      - "remove_label_ids (array): Label IDs to remove from matching messages [optional]"
      - "forward (string): Email address to forward matching messages to [optional]"
    outputs: "JSON object: { id, criteria, action } reflecting the created filter."

  - name: "gmail-delete-filter"
    description: "Deletes a Gmail filter. Removes the rule only — does not affect labels already applied to messages by that rule while it existed. Additive/reversible in effect since the filter can simply be recreated with gmail-create-filter; not gated by the irreversible-action approval steering."
    inputs:
      - "filter_id (string): Filter ID from gmail-list-filters or gmail-create-filter's output"
    outputs: "JSON object: { id, deleted: true }."

  - name: "gmail-batch-modify-labels"
    description: "Adds and/or removes labels across many messages in one call. Chunks internally at the underlying Gmail API's 1000-message-per-call limit, so any number of message_ids may be passed. Reversible — does not send or permanently delete anything. Pairs with gmail-create-filter to backfill a filter's criteria across existing history."
    inputs:
      - "message_ids (array): Gmail message IDs to modify"
      - "add_label_ids (array): Label IDs to add [optional]"
      - "remove_label_ids (array): Label IDs to remove [optional]"
    outputs: "JSON object: { modified_count: number, label_ids_added: string[], label_ids_removed: string[] }."

  # ── Gated — irreversible (see steering/generic/gmail-irreversible-action-approval.md) ──
  - name: "gmail-send-message"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Composes and immediately sends a new email."
    inputs:
      - "to (array): Recipient email addresses"
      - "subject (string): Subject line"
      - "body (string): Plain-text body"
      - "cc (array): CC recipient email addresses [optional]"
      - "bcc (array): BCC recipient email addresses [optional]"
    outputs: "JSON object: { id, thread_id } of the sent message."

  - name: "gmail-send-draft"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Sends an existing draft as-is."
    inputs:
      - "draft_id (string): Draft ID to send"
    outputs: "JSON object: { id, thread_id } of the sent message."

  - name: "gmail-reply-message"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Sends a reply within an existing thread, quoting the original message."
    inputs:
      - "message_id (string): Gmail message ID being replied to"
      - "body (string): Plain-text reply body"
      - "reply_all (boolean): Reply to all original recipients instead of just the sender [optional, default: false]"
    outputs: "JSON object: { id, thread_id } of the sent reply."

  - name: "gmail-delete-message"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Permanently deletes a message, bypassing Trash. Cannot be undone."
    inputs:
      - "message_id (string): Gmail message ID"
    outputs: "JSON object: { id, deleted: true }."

  - name: "gmail-delete-draft"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Permanently deletes a draft. Cannot be undone."
    inputs:
      - "draft_id (string): Draft ID"
    outputs: "JSON object: { draft_id, deleted: true }."

  - name: "gmail-delete-label"
    description: "Irreversible action — requires prior explicit human approval per steering; never call without it. Permanently deletes a user label and removes it from every message it is applied to. Cannot be undone."
    inputs:
      - "label_id (string): Label ID"
    outputs: "JSON object: { id, deleted: true }."
